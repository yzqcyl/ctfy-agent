services:
  web:
    build:
      context: ./services/web
    depends_on:
      flag-rotator:
        condition: service_completed_successfully
    ports:
      - "8000"
    volumes:
      - flagdata:/answers:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
  flag-rotator:
    image: ctfy/flag-rotator:latest
    volumes:
      - flagdata:/out
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

volumes:
  flagdata: {}