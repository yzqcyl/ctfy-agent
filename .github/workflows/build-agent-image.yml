# 构建 + 校验 + 推送 agent 镜像到 ghcr.io（全程云端，不碰本地虚拟网卡）
#
# 触发：仓库 Actions → 选本 workflow → Run workflow（手动）
# 产物：
#   - ghcr.io/yzqcyl/ctfy-agent:v1 和 :latest（推送到 GHCR）
#   - 一个 ctfy-agent.tar.gz 制品（可在 Actions 运行页下载留档）
# 前提：仓库是私有/公有均可；推 GHCR 用自带的 GITHUB_TOKEN，无需额外 secret。
name: build-agent-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（不带 ghcr.io 前缀）"
        required: false
        default: "v1"
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/ctfy-agent

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image（普通 docker build，让镜像落在本地 daemon，供校验/导出用）
        run: |
          docker build \
            -t "$IMAGE:${{ github.event.inputs.tag }}" \
            -t "$IMAGE:latest" \
            .

      - name: 校验：B1 契约（体积 / 目录洁净度 / cwd 无关 / 五条路径全部 exit 0）
        run: python3 tools/container_check.py --no-build --image "$IMAGE:${{ github.event.inputs.tag }}"

      - name: 导出 tar 制品
        run: docker save "$IMAGE:${{ github.event.inputs.tag }}" | gzip > ctfy-agent.tar.gz

      - name: 上传制品（留档 / 下载）
        uses: actions/upload-artifact@v4
        with:
          name: ctfy-agent
          path: ctfy-agent.tar.gz
          retention-days: 30

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送到 GHCR
        run: |
          docker push "$IMAGE:${{ github.event.inputs.tag }}"
          docker push "$IMAGE:latest"
